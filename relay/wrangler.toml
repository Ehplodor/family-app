name = "family-app-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Origine(s) autorisée(s), séparées par des virgules. Ex. : "https://ehplodor.github.io"
ALLOWED_ORIGINS = "*"
# Contact transmis aux services push (Google, Apple, Mozilla) en cas de problème.
VAPID_SUBJECT = "mailto:relay@example.invalid"
# Garde-fous pour un relais ouvert au public :
NEW_CIRCLES_PER_IP_PER_DAY = "10"   # nouveaux cercles par connexion et par jour
CIRCLE_QUOTA_MB = "250"             # espace maximum par famille (surtout les photos)
INACTIVE_DAYS = "400"               # un cercle sans aucune connexion pendant ce délai est effacé du relais
# VAPID_PUBLIC_KEY et VAPID_PRIVATE_JWK : générés par `npm run vapid`
# (la clé privée se règle avec `npx wrangler secret put VAPID_PRIVATE_JWK`).

[[durable_objects.bindings]]
name = "CIRCLE"
class_name = "Circle"

[[durable_objects.bindings]]
name = "INVITE"
class_name = "Invite"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Circle", "Invite"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]
