# Déploie le relais sur Cloudflare Workers, sans ordinateur (tout se fait depuis GitHub, même sur téléphone).
#
# Prérequis (une seule fois, voir le README « Mise en ligne depuis un téléphone ») :
#   - secret de dépôt CLOUDFLARE_API_TOKEN (modèle « Edit Cloudflare Workers ») ;
#   - facultatif : secret CLOUDFLARE_ACCOUNT_ID, si votre jeton donne accès à plusieurs comptes ;
#   - facultatif : variable RELAY_ALLOWED_ORIGINS (domaine personnalisé), sinon https://<compte>.github.io.
#
# Lancement : onglet Actions → Relay → Run workflow. Il se relance aussi tout seul quand le code du relais change sur main.
name: Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier la configuration
        id: config
        working-directory: .
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          CUSTOM_ORIGINS: ${{ vars.RELAY_ALLOWED_ORIGINS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=Relais non déployé::Ajoutez le secret CLOUDFLARE_API_TOKEN (voir le README, « Mise en ligne depuis un téléphone »)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # L'identifiant de compte n'est utile que si le jeton donne accès à plusieurs comptes.
          [ -n "$CF_ACCOUNT" ] && echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT" >> "$GITHUB_ENV"
          owner="${OWNER,,}"
          echo "origins=${CUSTOM_ORIGINS:-https://$owner.github.io}" >> "$GITHUB_OUTPUT"
          echo "site=https://$owner.github.io/$REPO/" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.skip != '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.config.outputs.skip != '1'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - if: steps.config.outputs.skip != '1'
        run: npm ci

      - name: Vérifier le code (types et tests d'intégration sur un relais local)
        if: steps.config.outputs.skip != '1'
        run: |
          npx tsc -p .
          npm run test:ci

      - name: Déployer sur Cloudflare
        id: deploy
        if: steps.config.outputs.skip != '1'
        env:
          ORIGINS: ${{ steps.config.outputs.origins }}
          SITE: ${{ steps.config.outputs.site }}
        run: |
          npx wrangler deploy --var "ALLOWED_ORIGINS:$ORIGINS" --var "VAPID_SUBJECT:$SITE" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error title=Adresse introuvable::Cloudflare n'a pas indiqué d'adresse workers.dev. Ouvrez une fois « Workers & Pages » dans le tableau de bord Cloudflare pour choisir votre sous-domaine, puis relancez."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Créer les clés de notification (une seule fois)
        if: steps.config.outputs.skip != '1'
        run: |
          if npx wrangler secret list --format json 2>/dev/null | grep -q '"VAPID_PRIVATE_JWK"'; then
            echo "Clés de notification déjà en place : on les garde (les changer désactiverait les notifications existantes)."
            exit 0
          fi
          keys=$(node scripts/vapid.mjs --json)
          priv=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).privateJwk)' "$keys")
          pub=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).publicKey)' "$keys")
          echo "::add-mask::$priv"
          printf '%s' "$priv" | npx wrangler secret put VAPID_PRIVATE_JWK
          printf '%s' "$pub" | npx wrangler secret put VAPID_PUBLIC_KEY
          echo "Clés de notification créées et enregistrées comme secrets Cloudflare."

      - name: Vérifier le relais en ligne
        if: steps.config.outputs.skip != '1'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for _ in $(seq 1 20); do curl -sf "$URL/" > /dev/null && break; sleep 3; done
          curl -sf "$URL/" > /dev/null || { echo "::error::Le relais ne répond pas sur $URL"; exit 1; }
          curl -sf "$URL/vapid" | grep -q '"publicKey":"' || { echo "::error::Clé de notification absente sur le relais"; exit 1; }
          echo "Relais en ligne : $URL"

      - name: Résumé
        if: steps.config.outputs.skip != '1'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CURRENT: ${{ vars.RELAY_URL }}
          ORIGINS: ${{ steps.config.outputs.origins }}
        run: |
          {
            echo "## ✅ Relais déployé"
            echo
            echo "**Adresse du relais :**"
            echo
            echo '```'
            echo "$URL"
            echo '```'
            echo
            if [ "$CURRENT" = "$URL" ]; then
              echo "La variable \`RELAY_URL\` est déjà à jour : rien d'autre à faire."
            else
              echo "👉 Copiez cette adresse dans **Settings → Secrets and variables → Actions → Variables → \`RELAY_URL\`**,"
              echo "puis relancez **Actions → GitHub Pages → Run workflow**."
              [ -n "$CURRENT" ] && echo && echo "(Valeur actuelle de \`RELAY_URL\` : \`$CURRENT\`)"
            fi
            echo
            echo "Site autorisé à utiliser ce relais : \`$ORIGINS\`"
          } >> "$GITHUB_STEP_SUMMARY"
