# Construit l'appli et la publie sur GitHub Pages à chaque push sur main.
# Réglage requis : Settings → Pages → Source = « GitHub Actions ».
# Variable de dépôt : Settings → Secrets and variables → Actions → Variables → RELAY_URL
#   (adresse du relais, ex. https://family-app-relay.<compte>.workers.dev). Vide = mode local sans partage.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : la construction (qui exécute le code des dépendances npm) ne peut que lire le dépôt ;
# seule l'étape de publication a le droit d'écrire sur GitHub Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par empreinte de commit (protection contre une action compromise).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérifier l'adresse du relais
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          if [ -z "$RELAY_URL" ]; then
            echo "::warning title=Mode local::Variable RELAY_URL vide : l'appli publiée fonctionnera sans partage ni notifications. Déployez le relais (Actions → Relay) puis renseignez RELAY_URL."
          fi
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
